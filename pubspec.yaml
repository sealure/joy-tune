name: via_music
description: 极简跨平台音乐播放器
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 网络
  dio: ^5.7.0

  # 音频
  # 本地存储
  # 本地数据库（SQLite）：收藏/歌单/播放历史/搜索历史/播放会话等，需同步表带 is_synced 标记
  drift: ^2.34.3
  # drift 的 Flutter 封装：统一移动端原生数据库与桌面端 ffi（自带 sqlite3_flutter_libs + path_provider）
  drift_flutter: ^0.3.1
  # 网络连接状态监听：网络恢复时触发后台同步
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # Google OAuth 登录
  google_sign_in: ^6.2.1

  # 窗口管理
  window_manager: ^0.4.3

  # 系统托盘/菜单栏图标
  system_tray: ^0.1.1

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.8.0

  # 图片缓存
  cached_network_image: ^3.4.1
  # 图片磁盘缓存管理器（清理缓存时一并清封面图片缓存）
  flutter_cache_manager: ^3.4.1

  # 工具
  path_provider: ^2.1.5
  uuid: ^4.5.1
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  media_kit_native_event_loop: ^1.0.9
  media_kit_libs_audio: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # drift 代码生成（与 drift 主版本一致）
  drift_dev: ^2.34.3
  build_runner: ^2.4.13
  # 单元测试 mock
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
