name: via_music
description: 极简跨平台音乐播放器
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 网络
  dio: ^5.7.0

  # 音频
  just_audio: ^0.9.42

  # 本地数据库
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.8.0

  # 图片缓存
  cached_network_image: ^3.4.1

  # 工具
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  isar_generator: ^3.1.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
