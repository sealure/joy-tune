# ============================================================
# 构建并发布 Android Release APK
#
# 触发方式:
#   - 推送形如 v0.0.1 的 tag 时自动触发(versionName 会自动同步为 0.0.1)
#   - 产物按 ABI 拆分,以 joy-tune_<版本>_<abi>.apk 上传到 GitHub Release
#
# 注意:
#   - 当前仓库 release 构建使用 debug 签名(android/app/build.gradle.kts
#     中 signingConfig = debug),生成的 APK 可安装但不可上架 Google Play;
#     如需正式签名,需在仓库配置 keystore 相关 Secrets 并在 build.gradle.kts 中配置。
# ============================================================
name: 构建并发布 Android APK

on:
  push:
    tags:
      - 'v*'

env:
  # 固定 Flutter 版本以稳定命中缓存(与本地开发版本一致,3.44.7)
  # 如需始终跟随最新 stable,删除下面这行并把 flutter-version 去掉即可
  FLUTTER_VERSION: '3.44.7'
  # 正式环境后端地址(CF 域名 + 后端 /api/v1 前缀)
  # 构建时通过 --dart-define 注入,替代代码里的 dev 局域网默认值;
  # 本地 flutter run 不传此参数,走 lib/config/api_config.dart 里的 dev 地址
  API_BASE_URL: 'https://va.1hub.ccwu.cc/api/v1'

jobs:
  build-apk:
    name: 构建 Release APK 并发布
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 发布 Release 需要写权限
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # AGP 9 需要 JDK 17+,先用 temurin 17 保证稳定
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------------
      # 关键优化:安装 Flutter SDK 与拉取 pub 依赖极慢(几百 MB)
      # subosito/flutter-action 的 cache: true 会同时缓存:
      #   1. 整个 Flutter SDK(下载后的 toolcache)
      #   2. pub 依赖缓存
      # 首次运行全量下载,之后命中缓存秒级完成
      # --------------------------------------------------------
      - name: 安装 Flutter SDK(含 SDK 与 pub 依赖缓存)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Gradle 依赖(AGP/Kotlin/第三方库)下载同样很慢,单独缓存 ~/.gradle
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 获取依赖
        run: flutter pub get

      # 从 GitHub Secrets 还原发布签名（keystore + key.properties）
      # 保证所有版本用同一把 key 签名，自更新才能无缝覆盖安装（否则每次 debug 签名不同 → 覆盖报"签名不同"）
      - name: 还原发布签名
        if: secrets.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/joy-tune-release.jks
          cat > android/app/key.properties <<'EOF'
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          storeFile=joy-tune-release.jks
          EOF
          ls -l android/app/joy-tune-release.jks

      # 把 pubspec.yaml 的 version 同步为 tag(tag v0.0.1 -> version 0.0.1+1),
      # 这样 APK 的 versionName 与发布版本一致;非 tag 触发时跳过
      - name: 同步版本号到 tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml
          echo "当前版本: $(grep '^version:' pubspec.yaml)"

      # --split-per-abi 按 CPU 架构拆分,避免单 APK 体积过大(84MB);
      # 生成 app-{arm64-v8a,armeabi-v7a,x86_64}-release.apk 三个产物
      - name: 构建 Release APK(按 ABI 拆分)
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      # 按 ABI 循环复制产物,命名为 joy-tune_<版本>_<abi>.apk(与仓库名一致)
      - name: 整理构建产物
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk#build/app/outputs/flutter-apk/app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "dist/joy-tune_${VERSION}_${abi}.apk"
          done
          ls -lh dist/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
